spring:
  application:
    name: spend-ai-app

  mvc:
    apiversion:
      enabled: true
      use:
        header: "X-API-Version"

      supported: 1.0,2.0
      default: 1.0

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      pool-name: production-pool
      maximum-pool-size: 5
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: openai/gpt-oss-20b
          temperature: 0.0
          options:
            reasoning_effort: low

jwt:
  secret-key: ${JWT_KEY}
  expiration-time-access-token-in-minutes: ${JWT_TOKEN_EXPIRE}

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${APP_URL:http://localhost:3000}

redis:
  url: ${REDIS_URL}

management:
  endpoints:
    web:
      exposure:
        include: metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true